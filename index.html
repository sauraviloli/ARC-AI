<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARC — AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0A0F1E;
      --navy-2: #111827;
      --navy-3: #1C2540;
      --navy-4: #263055;
      --gold: #C9A84C;
      --gold-light: #E8C97A;
      --gold-dim: rgba(201,168,76,0.15);
      --gold-border: rgba(201,168,76,0.3);
      --white: #F5F3EE;
      --white-dim: rgba(245,243,238,0.55);
      --white-faint: rgba(245,243,238,0.08);
      --border: rgba(255,255,255,0.07);
      --border-2: rgba(255,255,255,0.12);
      --mono: 'IBM Plex Mono', monospace;
      --serif: 'Instrument Serif', Georgia, serif;
      --sans: 'Geist', system-ui, sans-serif;
    }

    html, body { height: 100%; background: var(--navy); color: var(--white); font-family: var(--sans); overflow: hidden; }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    body::after {
      content: '';
      position: fixed; top: -200px; left: 50%; transform: translateX(-50%);
      width: 600px; height: 400px;
      background: radial-gradient(ellipse, rgba(201,168,76,0.07) 0%, transparent 70%);
      pointer-events: none; z-index: 0;
    }

    .shell {
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      height: 100vh;
      max-width: 860px;
      margin: 0 auto;
      position: relative;
    }

    /* HEADER */
    .header {
      position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 32px 20px;
      border-bottom: 0.5px solid var(--border);
    }

    .header-brand { display: flex; align-items: center; gap: 14px; }

    .logo-ring {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1.5px solid var(--gold);
      display: flex; align-items: center; justify-content: center;
      animation: pulse-ring 3s ease-in-out infinite;
    }

    @keyframes pulse-ring {
      0%,100% { box-shadow: 0 0 0 0 rgba(201,168,76,0.3); }
      50% { box-shadow: 0 0 0 6px rgba(201,168,76,0); }
    }

    .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); }

    .header-titles { display: flex; flex-direction: column; }

    .ai-name {
      font-family: var(--serif); font-size: 20px;
      color: var(--white); letter-spacing: 0.02em; line-height: 1;
    }
    .ai-name em { font-style: italic; color: var(--gold-light); }

    .ai-sub {
      font-size: 11px; color: var(--white-dim);
      font-family: var(--mono); letter-spacing: 0.08em; margin-top: 3px;
    }

    .live-pill {
      display: flex; align-items: center; gap: 6px;
      font-family: var(--mono); font-size: 11px; color: var(--gold);
      letter-spacing: 0.05em; background: var(--gold-dim);
      border: 0.5px solid var(--gold-border); padding: 5px 11px; border-radius: 20px;
    }

    .live-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--gold);
      animation: blink 1.8s ease-in-out infinite;
    }

    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* MESSAGES */
    .messages {
      position: relative; z-index: 10;
      overflow-y: auto; padding: 28px 32px;
      display: flex; flex-direction: column; gap: 24px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }

    .msg {
      display: flex; gap: 14px; align-items: flex-start;
      animation: slide-in 0.28s cubic-bezier(0.34,1.2,0.64,1) both;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .msg.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 2px;
      font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: 0.04em;
    }

    .msg.ai .msg-avatar { border: 1px solid var(--gold-border); background: var(--gold-dim); color: var(--gold); }
    .msg.user .msg-avatar { border: 0.5px solid var(--border-2); background: var(--white-faint); color: var(--white-dim); font-size: 9px; }

    .msg-body { max-width: 76%; display: flex; flex-direction: column; gap: 5px; }
    .msg.user .msg-body { align-items: flex-end; }

    .msg-sender { font-family: var(--mono); font-size: 10px; color: var(--white-dim); letter-spacing: 0.06em; }
    .msg.ai .msg-sender { color: var(--gold); }

    .msg-bubble {
      padding: 13px 18px; font-size: 14.5px; line-height: 1.7; border-radius: 16px;
    }

    .msg.ai .msg-bubble {
      background: var(--navy-3); border: 0.5px solid var(--border-2);
      color: var(--white); border-top-left-radius: 4px;
    }

    .msg.user .msg-bubble {
      background: linear-gradient(135deg, #C9A84C, #A88530);
      color: var(--navy); font-weight: 500; border-top-right-radius: 4px;
    }

    /* Image bubble */
    .img-bubble {
      background: var(--navy-3); border: 0.5px solid var(--border-2);
      border-radius: 16px; border-top-left-radius: 4px;
      overflow: hidden; max-width: 340px;
    }

    .img-bubble-label {
      font-family: var(--mono); font-size: 10px; color: var(--gold);
      letter-spacing: 0.06em; padding: 8px 12px 6px;
    }

    .img-bubble img {
      width: 100%; display: block;
      border-top: 0.5px solid var(--border);
    }

    .img-bubble .img-loading {
      height: 200px; display: flex; align-items: center; justify-content: center;
      color: var(--white-dim); font-family: var(--mono); font-size: 11px; gap: 8px;
    }

    /* Typing */
    .typing-bubble {
      padding: 16px 20px; background: var(--navy-3);
      border: 0.5px solid var(--border-2); border-radius: 16px; border-top-left-radius: 4px;
      display: flex; gap: 5px; align-items: center;
    }

    .typing-bubble span {
      width: 6px; height: 6px; border-radius: 50%; background: var(--gold); opacity: 0.4;
      animation: dot-bounce 1.3s infinite ease-in-out;
    }
    .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes dot-bounce {
      0%,60%,100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-7px); opacity: 1; }
    }

    /* CHIPS */
    .chips-row {
      position: relative; z-index: 10;
      display: flex; gap: 8px; padding: 0 32px 16px; flex-wrap: wrap;
    }

    .chip {
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em;
      padding: 7px 14px; border-radius: 20px;
      border: 0.5px solid var(--gold-border); background: var(--gold-dim);
      color: var(--gold-light); cursor: pointer; transition: all 0.18s ease; white-space: nowrap;
    }

    .chip:hover { background: rgba(201,168,76,0.25); border-color: var(--gold); transform: translateY(-1px); }

    /* INPUT */
    .input-bar {
      position: relative; z-index: 10;
      display: flex; align-items: center; gap: 10px;
      padding: 16px 32px 24px; border-top: 0.5px solid var(--border);
    }

    .input-wrap {
      flex: 1; display: flex; align-items: center; gap: 10px;
      background: var(--navy-3); border: 0.5px solid var(--border-2);
      border-radius: 14px; padding: 11px 16px; transition: border-color 0.2s;
    }

    .input-wrap:focus-within { border-color: var(--gold-border); box-shadow: 0 0 0 3px rgba(201,168,76,0.08); }

    .input-wrap input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--white); font-family: var(--sans); font-size: 14px; caret-color: var(--gold);
    }

    .input-wrap input::placeholder { color: var(--white-dim); }

    .send-btn {
      width: 38px; height: 38px; border-radius: 10px;
      background: linear-gradient(135deg, var(--gold), #A88530);
      border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: transform 0.15s, opacity 0.15s;
    }

    .send-btn:hover { transform: scale(1.05); }
    .send-btn:active { transform: scale(0.95); }
    .send-btn svg { width: 16px; height: 16px; }

    /* STATS */
    .stats-bar {
      position: relative; z-index: 10;
      display: flex; border-top: 0.5px solid var(--border);
      background: rgba(10,15,30,0.6);
    }

    .stat { flex: 1; padding: 10px 0; text-align: center; border-right: 0.5px solid var(--border); }
    .stat:last-child { border-right: none; }
    .stat-val { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--gold); }
    .stat-key { font-family: var(--mono); font-size: 10px; color: var(--white-dim); letter-spacing: 0.06em; margin-top: 2px; }

    /* WELCOME */
    .welcome {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      flex: 1; gap: 12px; padding: 40px 32px; text-align: center;
      animation: fade-in 0.6s ease both;
    }

    @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .welcome-icon {
      width: 60px; height: 60px; border-radius: 50%;
      border: 1px solid var(--gold-border); background: var(--gold-dim);
      display: flex; align-items: center; justify-content: center; margin-bottom: 4px;
      animation: pulse-ring 3s ease-in-out infinite;
    }

    .welcome h1 { font-family: var(--serif); font-size: 28px; font-weight: 400; color: var(--white); }
    .welcome h1 em { font-style: italic; color: var(--gold-light); }
    .welcome p { font-size: 14px; color: var(--white-dim); max-width: 380px; line-height: 1.7; }
  </style>
</head>
<body>

<div class="shell">

  <header class="header">
    <div class="header-brand">
      <div class="logo-ring"><div class="logo-dot"></div></div>
      <div class="header-titles">
        <span class="ai-name">A<em>rc</em></span>
        <span class="ai-sub">AI ASSISTANT</span>
      </div>
    </div>
    <div class="live-pill"><div class="live-dot"></div>ONLINE</div>
  </header>

  <div class="messages" id="msgs"></div>

  <div class="welcome" id="welcome">
    <div class="welcome-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
      </svg>
    </div>
    <h1>Hello, I'm <em>Arc</em></h1>
    <p>Your AI assistant. Ask me anything — questions, summaries, code, ideas, or generate an image.</p>
  </div>

  <div class="chips-row" id="chips">
    <button class="chip" onclick="send('Explain how machine learning works in simple terms')">Explain ML</button>
    <button class="chip" onclick="send('Write me a short professional bio')">Write a bio</button>
    <button class="chip" onclick="send('Generate an image of a futuristic city at night')">Generate image</button>
    <button class="chip" onclick="send('Give me 5 productivity tips')">Productivity tips</button>
  </div>

  <div class="input-bar">
    <div class="input-wrap">
      <input id="userInput" type="text" placeholder="Ask anything or say 'generate an image of…'" autocomplete="off" />
    </div>
    <button class="send-btn" onclick="sendMsg()" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0A0F1E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2L11 13M22 2L15 22 11 13 2 9l20-7z"/>
      </svg>
    </button>
  </div>

  <div class="stats-bar">
    <div class="stat"><div class="stat-val" id="s-msgs">0</div><div class="stat-key">MESSAGES</div></div>
    <div class="stat"><div class="stat-val" id="s-time">—</div><div class="stat-key">RESPONSE</div></div>
    <div class="stat"><div class="stat-val" id="s-tokens">—</div><div class="stat-key">TOKENS</div></div>
    <div class="stat"><div class="stat-val" id="s-session">00:00</div><div class="stat-key">SESSION</div></div>
  </div>

</div>

<script>
  const msgsEl = document.getElementById('msgs');
  const inputEl = document.getElementById('userInput');
  const welcomeEl = document.getElementById('welcome');
  const chipsEl = document.getElementById('chips');

  const history = [];
  let msgCount = 0;
  let sessionStart = Date.now();
  let isBusy = false;

  setInterval(() => {
    const s = Math.floor((Date.now() - sessionStart) / 1000);
    document.getElementById('s-session').textContent =
      String(Math.floor(s / 60)).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
  }, 1000);

  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });

  function send(text) { inputEl.value = text; sendMsg(); }

  function scrollDown() { msgsEl.scrollTop = msgsEl.scrollHeight; }

  function hideWelcome() {
    welcomeEl.style.display = 'none';
    setTimeout(() => {
      chipsEl.style.transition = 'opacity 0.3s';
      chipsEl.style.opacity = '0';
      setTimeout(() => chipsEl.style.display = 'none', 300);
    }, 4000);
  }

  function addBubble(role, text) {
    if (role === 'user' && msgCount === 0) hideWelcome();

    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'ai' ? 'AC' : 'YOU';

    const body = document.createElement('div');
    body.className = 'msg-body';

    const sender = document.createElement('div');
    sender.className = 'msg-sender';
    sender.textContent = role === 'ai' ? 'ARC' : 'YOU';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;

    body.appendChild(sender);
    body.appendChild(bubble);
    wrap.appendChild(avatar);
    wrap.appendChild(body);
    msgsEl.appendChild(wrap);
    msgCount++;
    document.getElementById('s-msgs').textContent = msgCount;
    scrollDown();
  }

  function addImageBubble(prompt) {
    if (msgCount === 0) hideWelcome();

    const wrap = document.createElement('div');
    wrap.className = 'msg ai';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = 'AC';

    const body = document.createElement('div');
    body.className = 'msg-body';

    const sender = document.createElement('div');
    sender.className = 'msg-sender';
    sender.textContent = 'ARC';

    const imgWrap = document.createElement('div');
    imgWrap.className = 'img-bubble';

    const label = document.createElement('div');
    label.className = 'img-bubble-label';
    label.textContent = 'IMAGE GENERATED';

    const loading = document.createElement('div');
    loading.className = 'img-loading';
    loading.innerHTML = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);animation:dot-bounce 1.3s infinite ease-in-out"></span> generating…';

    imgWrap.appendChild(label);
    imgWrap.appendChild(loading);
    body.appendChild(sender);
    body.appendChild(imgWrap);
    wrap.appendChild(avatar);
    wrap.appendChild(body);
    msgsEl.appendChild(wrap);
    scrollDown();

    // Build Pollinations URL
    const seed = Math.floor(Math.random() * 999999);
    const url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?width=800&height=600&nologo=true&seed=' + seed;

    const img = document.createElement('img');
    img.onload = () => {
      loading.remove();
      imgWrap.appendChild(img);
      msgCount++;
      document.getElementById('s-msgs').textContent = msgCount;
      scrollDown();
      isBusy = false;
    };
    img.onerror = () => {
      loading.textContent = 'Could not generate image. Try again.';
      isBusy = false;
    };
    img.src = url;

    return img;
  }

  function addTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'msg ai'; wrap.id = 'typing-msg';
    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar'; avatar.textContent = 'AC';
    const body = document.createElement('div'); body.className = 'msg-body';
    const sender = document.createElement('div'); sender.className = 'msg-sender'; sender.textContent = 'ARC';
    const tb = document.createElement('div'); tb.className = 'typing-bubble';
    tb.innerHTML = '<span></span><span></span><span></span>';
    body.appendChild(sender); body.appendChild(tb);
    wrap.appendChild(avatar); wrap.appendChild(body);
    msgsEl.appendChild(wrap);
    scrollDown();
  }

  function removeTyping() {
    const t = document.getElementById('typing-msg');
    if (t) t.remove();
  }

  function isImageRequest(text) {
    return /(generate|create|make|draw|show|render|produce|design).*(image|picture|photo|illustration|artwork|visual|painting|sketch)/i.test(text)
      || /(image|picture|photo|illustration|artwork|painting|sketch).*(of|showing|depicting)/i.test(text);
  }

  async function sendMsg() {
    if (isBusy) return;
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    isBusy = true;

    addBubble('user', text);
    history.push({ role: 'user', content: text });

    const t0 = Date.now();

    if (isImageRequest(text)) {
      // Strip filler words to get the actual image subject
      const prompt = text
        .replace(/^(please\s+)?(generate|create|make|draw|show me|render|produce|design)\s+(an?\s+)?(image|picture|photo|illustration|artwork|painting|sketch)(\s+of)?\s*/i, '')
        .trim() || text;

      addImageBubble(prompt);
      history.push({ role: 'assistant', content: '[Generated image: ' + prompt + ']' });
      document.getElementById('s-time').textContent = ((Date.now() - t0) / 1000).toFixed(1) + 's';
      return;
    }

    addTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: [
            { role: 'system', content: 'You are Arc, a sharp and helpful AI assistant. Answer clearly and concisely. You can help with any topic — questions, writing, code, analysis, brainstorming, and more.' },
            ...history
          ]
        })
      });

      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content || 'I encountered an issue — please try again.';
      const elapsed = ((Date.now() - t0) / 1000).toFixed(1) + 's';
      const tokens = data.usage?.total_tokens || 0;

      removeTyping();
      history.push({ role: 'assistant', content: reply });
      addBubble('ai', reply);
      document.getElementById('s-time').textContent = elapsed;
      document.getElementById('s-tokens').textContent = tokens;
    } catch (err) {
      removeTyping();
      addBubble('ai', 'Having trouble connecting. Check your API config and try again.');
    }

    isBusy = false;
  }
</script>

</body>
</html>
