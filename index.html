<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f6f3;
      --surface: #ffffff;
      --border: #e5e4e0;
      --border-input: #d1cfc9;
      --text-primary: #1a1915;
      --text-secondary: #6b6860;
      --text-tertiary: #9b9890;
      --accent: #d97706;
      --accent-bg: #fef3c7;
      --user-bubble: #1a1915;
      --user-text: #fafaf9;
      --ai-bubble: #ffffff;
      --sans: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      --radius: 18px;
    }

    html, body {
      height: 100%;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text-primary);
      overflow: hidden;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* ── LAYOUT ── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 760px;
      margin: 0 auto;
    }

    /* ── HEADER ── */
    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: relative;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .logo-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--user-bubble);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-mark svg { width: 16px; height: 16px; }

    .logo-name {
      font-size: 17px;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .new-chat-btn {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 13px;
      font-family: var(--sans);
      cursor: pointer;
      transition: all 0.15s;
    }

    .new-chat-btn:hover {
      background: var(--bg);
      color: var(--text-primary);
      border-color: var(--border-input);
    }

    /* ── MESSAGES ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .messages::-webkit-scrollbar-thumb:hover { background: var(--border-input); }

    /* Message groups */
    .msg-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 16px;
      animation: msg-in 0.2s ease both;
    }

    @keyframes msg-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-group.user { align-items: flex-end; }
    .msg-group.ai { align-items: flex-start; }

    .msg-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-tertiary);
      padding: 0 4px;
      margin-bottom: 4px;
    }

    .bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 15px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg-group.user .bubble {
      background: var(--user-bubble);
      color: var(--user-text);
      border-bottom-right-radius: 5px;
    }

    .msg-group.ai .bubble {
      background: var(--ai-bubble);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
    }

    /* Image bubble */
    .img-bubble {
      max-width: 80%;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      background: var(--ai-bubble);
      border-bottom-left-radius: 5px;
    }

    .img-generating {
      padding: 24px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
      font-size: 14px;
    }

    .img-spinner {
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--text-secondary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .img-bubble img {
      width: 100%;
      display: block;
      max-height: 400px;
      object-fit: cover;
    }

    /* Typing dots */
    .typing-bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 5px;
      padding: 14px 18px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .typing-bubble span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text-tertiary);
      animation: tdot 1.2s ease-in-out infinite;
    }

    .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
    .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes tdot {
      0%,60%,100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* ── WELCOME ── */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 32px 24px;
      text-align: center;
      gap: 10px;
      animation: msg-in 0.4s ease both;
    }

    .welcome-avatar {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: var(--user-bubble);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 6px;
    }

    .welcome-avatar svg { width: 28px; height: 28px; }

    .welcome h1 {
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -0.4px;
      color: var(--text-primary);
    }

    .welcome p {
      font-size: 15px;
      color: var(--text-secondary);
      max-width: 340px;
      line-height: 1.6;
    }

    /* ── SUGGESTION CHIPS ── */
    .suggestions {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 16px 24px 8px;
      justify-content: center;
    }

    .sug-chip {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 13.5px;
      font-family: var(--sans);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .sug-chip:hover {
      border-color: var(--border-input);
      color: var(--text-primary);
      background: var(--bg);
    }

    /* ── INPUT AREA ── */
    .input-area {
      flex-shrink: 0;
      padding: 12px 20px 20px;
      background: var(--bg);
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border-input);
      border-radius: 16px;
      padding: 10px 10px 10px 16px;
      transition: border-color 0.15s, box-shadow 0.15s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .input-box:focus-within {
      border-color: #a8a49e;
      box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
    }

    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: var(--sans);
      font-size: 15px;
      color: var(--text-primary);
      resize: none;
      max-height: 160px;
      min-height: 26px;
      line-height: 1.6;
      overflow-y: auto;
    }

    .input-box textarea::placeholder { color: var(--text-tertiary); }

    .send-btn {
      width: 34px; height: 34px;
      border-radius: 10px;
      background: var(--user-bubble);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.1s;
    }

    .send-btn:hover { opacity: 0.85; }
    .send-btn:active { transform: scale(0.93); }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .send-btn svg { width: 15px; height: 15px; }

    .input-hint {
      text-align: center;
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="header-logo">
      <div class="logo-mark">
        <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="8" r="6" stroke="white" stroke-width="1.5"/>
          <path d="M8 5v3.5l2.5 1.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="logo-name">Arc</span>
    </div>
    <button class="new-chat-btn" onclick="newChat()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      New chat
    </button>
  </header>

  <!-- MESSAGES -->
  <div class="messages" id="msgs"></div>

  <!-- WELCOME -->
  <div class="welcome" id="welcome">
    <div class="welcome-avatar">
      <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="14" cy="14" r="10" stroke="white" stroke-width="1.8"/>
        <path d="M14 9v5.5l3.5 2" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>How can I help you?</h1>
    <p>Ask me anything — questions, writing, code, analysis, or generate an image.</p>
  </div>

  <!-- SUGGESTIONS -->
  <div class="suggestions" id="suggestions">
    <button class="sug-chip" onclick="send('Explain how machine learning works in simple terms')">Explain machine learning</button>
    <button class="sug-chip" onclick="send('Write me a short professional bio')">Write a bio</button>
    <button class="sug-chip" onclick="send('Generate an image of a futuristic city at night')">Generate an image</button>
    <button class="sug-chip" onclick="send('Give me 5 productivity tips for remote work')">Productivity tips</button>
  </div>

  <!-- INPUT -->
  <div class="input-area">
    <div class="input-box">
      <textarea
        id="userInput"
        placeholder="Message Arc…"
        rows="1"
        autocomplete="off"
        spellcheck="true"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMsg()" aria-label="Send" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
    </div>
    <div class="input-hint">Arc can make mistakes. Verify important information.</div>
  </div>

</div>

<script>
  const msgsEl = document.getElementById('msgs');
  const inputEl = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const welcomeEl = document.getElementById('welcome');
  const suggestionsEl = document.getElementById('suggestions');

  const history = [];
  let isBusy = false;

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
    sendBtn.disabled = !inputEl.value.trim();
  });

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMsg();
    }
  });

  function scrollDown() {
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  function hideWelcome() {
    welcomeEl.style.display = 'none';
    suggestionsEl.style.display = 'none';
  }

  function newChat() {
    msgsEl.innerHTML = '';
    history.length = 0;
    isBusy = false;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';
    welcomeEl.style.display = 'flex';
    suggestionsEl.style.display = 'flex';
  }

  function send(text) {
    inputEl.value = text;
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
    sendBtn.disabled = false;
    sendMsg();
  }

  function addUserMsg(text) {
    if (msgsEl.children.length === 0) hideWelcome();
    const group = document.createElement('div');
    group.className = 'msg-group user';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    group.appendChild(bubble);
    msgsEl.appendChild(group);
    scrollDown();
  }

  function addTyping() {
    const group = document.createElement('div');
    group.className = 'msg-group ai';
    group.id = 'typing-group';
    const tb = document.createElement('div');
    tb.className = 'typing-bubble';
    tb.innerHTML = '<span></span><span></span><span></span>';
    group.appendChild(tb);
    msgsEl.appendChild(group);
    scrollDown();
    return group;
  }

  function removeTyping() {
    const t = document.getElementById('typing-group');
    if (t) t.remove();
  }

  function addAiMsg(text) {
    const group = document.createElement('div');
    group.className = 'msg-group ai';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    group.appendChild(bubble);
    msgsEl.appendChild(group);
    scrollDown();
  }

  function addImageMsg(prompt) {
    const group = document.createElement('div');
    group.className = 'msg-group ai';

    const imgWrap = document.createElement('div');
    imgWrap.className = 'img-bubble';

    const loading = document.createElement('div');
    loading.className = 'img-generating';
    loading.innerHTML = '<div class="img-spinner"></div><span>Generating image…</span>';
    imgWrap.appendChild(loading);
    group.appendChild(imgWrap);
    msgsEl.appendChild(group);
    scrollDown();

    const seed = Math.floor(Math.random() * 999999);
    const url = 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt + ', high quality, detailed') + '?width=800&height=500&nologo=true&seed=' + seed;

    const img = document.createElement('img');
    img.onload = () => {
      loading.remove();
      imgWrap.appendChild(img);
      scrollDown();
      isBusy = false;
      sendBtn.disabled = !inputEl.value.trim();
    };
    img.onerror = () => {
      loading.innerHTML = '<span style="color:var(--text-secondary);font-size:14px">Could not generate image. Try again.</span>';
      isBusy = false;
      sendBtn.disabled = !inputEl.value.trim();
    };
    img.src = url;
  }

  function isImageRequest(text) {
    return /(generate|create|make|draw|show|render|produce|design).*(image|picture|photo|illustration|artwork|visual|painting|sketch)/i.test(text)
      || /(image|picture|photo|illustration|painting|sketch)\s+(of|showing|depicting)/i.test(text);
  }

  function extractPrompt(text) {
    return text
      .replace(/^(please\s+)?(generate|create|make|draw|show me|render|produce|design)\s+(an?\s+)?(image|picture|photo|illustration|artwork|painting|sketch)(\s+(of|showing|depicting))?\s*/i, '')
      .trim() || text;
  }

  async function sendMsg() {
    if (isBusy) return;
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;
    isBusy = true;

    addUserMsg(text);
    history.push({ role: 'user', content: text });

    if (isImageRequest(text)) {
      const prompt = extractPrompt(text);
      addImageMsg(prompt);
      history.push({ role: 'assistant', content: '[Generated image: ' + prompt + ']' });
      return;
    }

    addTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: [
            { role: 'system', content: 'You are Arc, a sharp and helpful AI assistant. Answer clearly and concisely. You can help with any topic — questions, writing, code, analysis, brainstorming, and more.' },
            ...history
          ]
        })
      });

      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content || 'Something went wrong. Please try again.';

      removeTyping();
      history.push({ role: 'assistant', content: reply });
      addAiMsg(reply);
    } catch (err) {
      removeTyping();
      addAiMsg('Having trouble connecting. Check your API config and try again.');
    }

    isBusy = false;
    sendBtn.disabled = !inputEl.value.trim();
  }
</script>

</body>
</html>
